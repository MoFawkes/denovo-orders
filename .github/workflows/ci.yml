name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Install automation dependencies (for import resolution)
        working-directory: scripts/gmail-automations
        run: npm ci

      - name: Lint automation scripts
        run: npx eslint scripts/gmail-automations --no-error-on-unmatched-pattern --max-warnings 0

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - name: Type-check Supabase Edge Functions
        run: |
          for function in supabase/functions/*/index.ts; do
            deno check --node-modules-dir=auto "${function}"
          done

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Load the pre-migration baseline
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/pre_migrations_baseline.sql
      - name: Apply migrations in timestamp order
        run: |
          previous=""
          for migration in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            current="$(basename "${migration}")"
            if [ -n "${previous}" ] && [[ "${current}" < "${previous}" ]]; then
              echo "Migration ordering error: ${current} follows ${previous}" >&2
              exit 1
            fi
            psql --set ON_ERROR_STOP=1 --file "${migration}"
            previous="${current}"
          done

  automations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 to match the gmail-automations.yml jobs that run these
      # scripts in production.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/gmail-automations/package-lock.json

      - name: Install dependencies
        working-directory: scripts/gmail-automations
        run: npm ci

      - name: Syntax-check every automation script
        run: git ls-files '*.mjs' | xargs -n1 node --check

      - name: Run automation tests
        working-directory: scripts/gmail-automations
        run: npm test
