name: Gmail automations

# Hourly Gmail-polling automations that write to Supabase. These run here
# (rather than as Claude Code cloud routines) because the cloud routine
# sandbox's egress proxy blocks outbound calls to supabase.co and blocks
# mutating GitHub API calls — a normal GitHub-hosted runner has neither
# restriction. See scripts/gmail-automations/README.md for setup.

on:
  schedule:
    # Deliberately not "0 * * * *": the top of the hour is the single most
    # congested minute across all of GitHub Actions (everyone schedules
    # there), and GitHub's own docs warn scheduled runs get delayed or
    # dropped under that load. Measured via the Actions API: with "0 * * *
    # *" this workflow's actual median gap between runs was ~97 minutes,
    # not 60, with some gaps over 4 hours -- not caused by job runtime
    # (every job here finishes in under a minute). Picking an off-the-hour
    # minute avoids that contention.
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended writes without changing Gmail, Drive, Tasks, or Supabase
        type: boolean
        default: false
      portal_mode:
        description: ISC Portal rollout mode (submitting mode uses the protected portal-submission environment)
        type: choice
        options: [submit-fresh, disabled, validate-config, login-smoke, navigate-only, submit-one]
        default: submit-fresh
      invoice_start:
        description: Optional next invoice number to carry on from (leave blank to continue automatically)
        type: string
        default: ''
      portal_po:
        description: Required PO for submit-one; optional filter for navigate-only
        type: string
        default: ''
      portal_run_id:
        description: >-
          Recover a portal-handoff manifest from a prior run's artifact
          instead of this run's own (needed once the source Gmail thread is
          already Processed, since draft-packing-list can't rebuild it).
          Leave blank to use this run's own manifest as normal.
        type: string
        default: ''

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

permissions:
  contents: read

jobs:
  mark-sample-approved:
    runs-on: [self-hosted, linux, x64, denovo-orders]
    environment: production
    timeout-minutes: 15
    concurrency:
      group: sample-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run sample-approval automation
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAMPLE_APPROVAL_SECRET: ${{ secrets.SAMPLE_APPROVAL_SECRET }}
        run: node scripts/gmail-automations/mark-sample-approved.mjs

  mark-order-booked:
    runs-on: [self-hosted, linux, x64, denovo-orders]
    environment: production
    timeout-minutes: 15
    concurrency:
      group: booking-confirmations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run booking-confirmation automation
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOKING_AUTOMATION_SECRET: ${{ secrets.BOOKING_AUTOMATION_SECRET }}
        run: node scripts/gmail-automations/mark-order-booked.mjs

  complete-from-packing-list:
    runs-on: [self-hosted, linux, x64, denovo-orders]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: packing-list-pipeline
      cancel-in-progress: false
    # Runs after draft-packing-list so a sheet drafted in this run is picked
    # up immediately instead of waiting for the next hourly run. Not `needs`'
    # default behaviour alone: if drafting fails (e.g. an upload left for
    # retry), completion of already-uploaded sheets should still run.
    needs: draft-packing-list
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run packing-list completion automation
        env:
          # denovogb token: it owns both the Drive packing lists and the
          # Google Tasks created by mark-order-booked. Requires the
          # drive.readonly scope (re-run oauth-setup.mjs if this 403s).
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          PACKING_LIST_DB_SECRET: ${{ secrets.PACKING_LIST_DB_SECRET }}
        run: node scripts/gmail-automations/complete-order-from-packing-list.mjs

  draft-packing-list:
    needs: mark-order-booked
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, denovo-orders]
    environment: production
    timeout-minutes: 30
    concurrency:
      group: packing-list-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run packing-list drafting automation
        env:
          # denovogb token again: reads the forwarded docket photos, replies
          # in-thread, and uploads the generated sheet. Requires the
          # drive.file scope (re-run oauth-setup.mjs if uploads 403).
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PACKING_LIST_DB_SECRET: ${{ secrets.PACKING_LIST_DB_SECRET }}
          PORTAL_HANDOFF_DIR: ${{ runner.temp }}/portal-handoff
          INVOICE_START: ${{ github.event_name == 'workflow_dispatch' && inputs.invoice_start || '' }}
        run: node scripts/gmail-automations/draft-packing-list.mjs
      - name: Upload fresh Portal handoff
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-handoff
          path: ${{ runner.temp }}/portal-handoff/*.json
          if-no-files-found: ignore
          retention-days: 1

  portal-submission:
    runs-on: [self-hosted, linux, x64, denovo-orders]
    timeout-minutes: 30
    needs: draft-packing-list
    if: >-
      ${{ needs.draft-packing-list.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.portal_mode != 'disabled') ||
           (github.event_name == 'schedule' && vars.PORTAL_SCHEDULED_ENABLED == '1')) }}
    environment: ${{ github.event_name == 'workflow_dispatch' && (inputs.portal_mode == 'submit-one' || inputs.portal_mode == 'submit-fresh') && 'portal-submission' || 'production' }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: isc-portal-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Download fresh Portal handoff
        if: ${{ inputs.portal_mode != 'validate-config' && inputs.portal_mode != 'login-smoke' }}
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: portal-handoff
          path: ${{ runner.temp }}/portal-handoff
          run-id: ${{ inputs.portal_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install Chromium
        if: ${{ inputs.portal_mode != 'validate-config' }}
        working-directory: scripts/gmail-automations
        run: npx playwright install --with-deps chromium
      - name: Run ISC Portal automation
        env:
          PORTAL_RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.portal_mode }}
          PORTAL_PO: ${{ inputs.portal_po }}
          PORTAL_HANDOFF_DIR: ${{ runner.temp }}/portal-handoff
          PORTAL_TRACE_DIR: ${{ runner.temp }}/portal-trace
          PORTAL_SCHEDULED_ENABLED: ${{ vars.PORTAL_SCHEDULED_ENABLED }}
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          PORTAL_TOTP_SECRET: ${{ secrets.PORTAL_TOTP_SECRET }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          PACKING_LIST_DB_SECRET: ${{ secrets.PACKING_LIST_DB_SECRET }}
        run: node scripts/gmail-automations/portal-automation.mjs
      - name: Upload Portal trace on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-trace
          path: ${{ runner.temp }}/portal-trace/trace.zip
          if-no-files-found: ignore
          retention-days: 3

  generate-docket:
    runs-on: [self-hosted, linux, x64, denovo-orders]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: docket-generation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run docket-generation automation
        env:
          # Same OAuth client as the other two jobs (it identifies the app,
          # not the mailbox) but a separate refresh token, since this reads
          # denovosourcing@gmail.com instead of denovogb@gmail.com.
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_SOURCING_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_SOURCING_OAUTH_REFRESH_TOKEN }}
          DOCKET_DB_SECRET: ${{ secrets.DOCKET_DB_SECRET }}
        run: node scripts/gmail-automations/generate-docket.mjs

  alert-on-failure:
    if: ${{ always() && failure() }}
    needs: [mark-sample-approved, mark-order-booked, draft-packing-list, complete-from-packing-list, generate-docket, portal-submission]
    runs-on: [self-hosted, linux, x64, denovo-orders]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the automation failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Gmail automations are failing"
          body="$(printf 'Workflow run failed: %s\n\nTrigger: %s\nCommit: %s\nDry run: %s' \
            "${RUN_URL}" '${{ github.event_name }}' '${{ github.sha }}' "${DRY_RUN}")"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
