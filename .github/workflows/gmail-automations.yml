name: Gmail automations

# Hourly Gmail-polling automations that write to Supabase. These run here
# (rather than as Claude Code cloud routines) because the cloud routine
# sandbox's egress proxy blocks outbound calls to supabase.co and blocks
# mutating GitHub API calls — a normal GitHub-hosted runner has neither
# restriction. See scripts/gmail-automations/README.md for setup.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended writes without changing Gmail, Drive, Tasks, or Supabase
        type: boolean
        default: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

permissions:
  contents: read

jobs:
  mark-sample-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sample-approvals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run sample-approval automation
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAMPLE_APPROVAL_SECRET: ${{ secrets.SAMPLE_APPROVAL_SECRET }}
        run: node scripts/gmail-automations/mark-sample-approved.mjs

  mark-order-booked:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: booking-confirmations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run booking-confirmation automation
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOKING_AUTOMATION_SECRET: ${{ secrets.BOOKING_AUTOMATION_SECRET }}
        run: node scripts/gmail-automations/mark-order-booked.mjs

  complete-from-packing-list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: packing-list-pipeline
      cancel-in-progress: false
    # Runs after draft-packing-list so a sheet drafted in this run is picked
    # up immediately instead of waiting for the next hourly run. Not `needs`'
    # default behaviour alone: if drafting fails (e.g. an upload left for
    # retry), completion of already-uploaded sheets should still run.
    needs: draft-packing-list
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run packing-list completion automation
        env:
          # denovogb token: it owns both the Drive packing lists and the
          # Google Tasks created by mark-order-booked. Requires the
          # drive.readonly scope (re-run oauth-setup.mjs if this 403s).
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          PACKING_LIST_DB_SECRET: ${{ secrets.PACKING_LIST_DB_SECRET }}
        run: node scripts/gmail-automations/complete-order-from-packing-list.mjs

  draft-packing-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: packing-list-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run packing-list drafting automation
        env:
          # denovogb token again: reads the forwarded docket photos, replies
          # in-thread, and uploads the generated sheet. Requires the
          # drive.file scope (re-run oauth-setup.mjs if uploads 403).
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PACKING_LIST_DB_SECRET: ${{ secrets.PACKING_LIST_DB_SECRET }}
        run: node scripts/gmail-automations/draft-packing-list.mjs

  generate-docket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docket-generation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-automation
      - name: Run docket-generation automation
        env:
          # Same OAuth client as the other two jobs (it identifies the app,
          # not the mailbox) but a separate refresh token, since this reads
          # denovosourcing@gmail.com instead of denovogb@gmail.com.
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_SOURCING_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_SOURCING_OAUTH_REFRESH_TOKEN }}
          DOCKET_DB_SECRET: ${{ secrets.DOCKET_DB_SECRET }}
        run: node scripts/gmail-automations/generate-docket.mjs

  alert-on-failure:
    if: ${{ failure() }}
    needs: [mark-sample-approved, mark-order-booked, draft-packing-list, complete-from-packing-list, generate-docket]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the automation failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Gmail automations are failing"
          body="$(printf 'Workflow run failed: %s\n\nTrigger: %s\nCommit: %s\nDry run: %s' \
            "${RUN_URL}" '${{ github.event_name }}' '${{ github.sha }}' "${DRY_RUN}")"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
